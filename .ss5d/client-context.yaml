client:
  name: "Aspire"
  industry: "Tax Advisory, Business Education & Financial Strategy"
  description: |
    Aspire is a tax strategy advisory and education organization focused on helping small and medium
    business owners reduce tax liability through advanced, proactive tax planning.

    Aspire provides access to elite tax strategies, community-based education, and CPA-aligned guidance.
    However, while members gain awareness of powerful tax strategies, many struggle with consistent
    execution due to operational complexity, lack of structured workflows, and insufficient
    accountability systems.

    Hey Drew represents Aspire's strategic move into a technology-enabled execution platform,
    transforming tax strategy knowledge into scalable, structured, and enforceable systems.

project:
  name: "Hey Drew – Tax Strategy Execution & Accountability Platform"
  summary: |
    Hey Drew is a technology-driven tax strategy execution and accountability platform designed to
    become the system of record for a small business owner's tax life.

    It solves the execution gap in tax planning by transforming elite tax strategy knowledge into
    deterministic workflows supported by AI guidance and human oversight.

    Rather than functioning as an educational product or AI chatbot, Hey Drew operationalizes
    strategy implementation through:
    - Structured execution workflows
    - Task enforcement and reminders
    - AI-assisted guidance
    - Human-in-the-loop approvals
    - Auditability and compliance controls

    The core problem it solves:
    Small and medium business owners are aware of tax strategies but consistently fail to implement
    them due to time constraints, lack of systems, and operational friction.

  why-now: |
    - Increasing dissatisfaction with traditional CPAs who focus on filing rather than proactive execution.
    - Growing willingness among SMBs to pay for outcomes rather than advice.
    - AI tools becoming table stakes, requiring differentiation beyond chat.
    - Clear competitive whitespace: no dominant player owns strategy + execution + accountability + auditability.
    - Internal urgency driven by the April 1st demo milestone.

  success-criteria:
    - "Users complete strategies end-to-end with system guidance."
    - "Execution drop-off is prevented via structured tasks and enforcement."
    - "Strategy progress is visible and auditable."
    - "Human oversight is embedded without breaking scalability."
    - "The platform becomes the trusted system of record for tax execution."
    - "Customers are willing to pay a premium for guaranteed execution discipline."

  history: |
    Greenfield technology product.
    While tax strategy knowledge exists within Aspire, no structured system has been built to
    operationalize execution through deterministic workflows and AI orchestration.

users:
  - type: "Business Owner"
    description: |
      Small to medium business owners generating approximately $250k–$1M annually.
      Already working with a CPA but dissatisfied with:
      - Lack of proactive planning
      - Poor execution follow-through
      - Fragmented document workflows

      They care about:
      - Concrete savings
      - Clear next steps
      - Reduced friction
      - Time efficiency
      - Compliance confidence
    behaviors:
      - "High awareness, low execution consistency."
      - "Drop off without structured accountability."
      - "Prefer guided steps over educational content."
      - "Motivated by visible ROI."

  - type: "CPA / Internal Pod Operator"
    description: |
      Tax professionals responsible for reviewing strategies, validating eligibility, requesting
      missing info, and guiding execution.

      They care about:
      - Structured, auditable workflows
      - Reduced manual prep
      - Clear document normalization
      - Decision traceability
      - Operational efficiency across multiple clients
    behaviors:
      - "Skeptical of ungrounded AI."
      - "Require deterministic logic."
      - "Value human oversight checkpoints."
      - "Need clear visibility into overrides and approvals."
      - "Needs fast case triage, shared context, strong audit/compliance logging, and async messaging."
      - "Wants minimal manual coordination and fewer 'status ping' loops."

