domain:
  terminology:
    - term: "Tax Strategy"
      meaning: "A legally compliant structured method to reduce tax liability."
    - term: "Execution Workflow"
      meaning: "A sequence of required tasks, dependencies, and deadlines to implement a strategy."
    - term: "Human-in-the-Loop (HITL)"
      meaning: "CPA or internal approval checkpoints embedded within automated workflows."
    - term: "System of Record"
      meaning: "The authoritative source of truth for strategy lifecycle and status."
    - term: "Strategy Eligibility"
      meaning: "Deterministic rules that determine whether a user qualifies for a strategy."
    - term: "Audit Trail"
      meaning: "Log of actions, approvals, overrides, and system events."
    - term: "Execution State"
      meaning: "Status of strategy progression (pending, in progress, blocked, completed)."
    - term: "SOC 2"
      meaning: "Security/compliance framework needed for handling sensitive data and building partner trust."
    - term: "GLBA"
      meaning: "US regulation governing protection of consumer financial information (PII)."
    - term: "PII"
      meaning: "Personally Identifiable Information (must be protected in storage, transit, and access)."
    - term: "IDP / OCR"
      meaning: "Intelligent Document Processing / Optical Character Recognition used to extract structured data from PDFs/images."
    - term: "Augusta Rule"
      meaning: "Strategy enabling business use of personal residence rental (requires compliant contract + supporting documentation)."
    - term: "Token redemption"
      meaning: "Controlled access approach (invite/token) used instead of payments for early beta."

  concepts: |
    - Execution enforcement is the core differentiator.
    - AI must be grounded in deterministic, auditable outputs.
    - Compliance posture (SOC 2 / GLBA) influences architecture.
    - Human oversight is required for trust and adoption.
    - Document ingestion is foundational but not differentiating.
    - Strategy value is realized only when execution is enforced.
    - Strategies are "known," but execution requires workflows, artifact generation, and accountability (tasks/checklists).
    - The product must balance education + action + compliance, not just chat.
    - Scaling depends on reducing back-office effort via structure, automation, and clean handoffs.
    - "Tax filing" may be offloaded via external API partners rather than built in-house initially.

